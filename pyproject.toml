[tool.poetry]
name = "radio-dstools"
version = "2.0.0"
description = "A processing pipeline to produce dynamic spectra from visibilities."
authors = ["Joshua Pritchard <joshua.pritchard@csiro.au>"]
packages = [
    {include = "dstools"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License"
]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
click = ">=8.1,<9"
matplotlib = ">=3.8,<3.11"
numpy = ">=2.0,<2.3"
scipy = ">=1.14,<1.17"
astropy = ">=6.1.7,<7"
pandas = ">=2.2.3,<3"
h5py = ">=3.11,<4"
colorlog = ">=6.8,<7"
casaconfig = {version = ">=1.5,<2", markers = "platform_system == 'Linux' and platform_machine == 'x86_64'"}
casatasks = {version = ">=6.7.3,<6.8", markers = "platform_system == 'Linux' and platform_machine == 'x86_64'"}
casatools = {version = ">=6.7.3,<6.8", markers = "platform_system == 'Linux' and platform_machine == 'x86_64'"}
dask = ">=2024.11,<2026"
xarray = ">=2024.11,<2026"
mpl-point-clicker = ">=0.4.1,<0.5"
radio-beam = ">=0.3.8,<0.4"
fixms = {version = ">=0.4.1,<0.5", markers = "platform_system == 'Linux' and platform_machine == 'x86_64'"}
python-casacore = {version = ">=3.7.1,<4", markers = "platform_system == 'Linux' and platform_machine == 'x86_64'"}
rm-lite = ">=2025.4,<2026"
cal-cabb = ">=0.1.0,<0.2"
astroplan = ">=0.10.1,<0.11"
numba = ">=0.61.2,<0.62"
datashader = ">=0.18.2,<0.19"
scikit-learn = "^1.8.0"

[tool.poetry.scripts]
dstools-atca-cal = "dstools.cli.atca_cal:main"
dstools-askap-preprocess = "dstools.cli.askap_preprocess:main"
dstools-derotate-feeds = "dstools.cli.derotate_feeds:main"
dstools-create-model = "dstools.cli.create_model:main"
dstools-insert-model = "dstools.cli.insert_model:main"
dstools-selfcal = "dstools.cli.selfcal:main"
dstools-subtract-model = "dstools.cli.subtract_model:main"
dstools-extract-ds = "dstools.cli.extract_ds:main"
dstools-plot-ds = "dstools.cli.plot_ds:main"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pre-commit = "^4.1.0"
coverage = "^7.4.1"
mypy = "^1.15.0"
pytest-mock = "^3.12.0"
pytest-cov = "^4.1.0"
ruff = "^0.11.4"
isort = "^6.0.1"
python-lsp-server = "^1.12.2"

[tool.ruff]
lint.ignore = ["E741"]

[tool.pyright]
reportMissingTypeStubs = false
reportGeneralTypeIssues = false
reportOptionalSubscript = false
reportOptionalMemberAccess = false

[tool.pytest.ini_options]
addopts = "--strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:casaconfig",
    "ignore:'datfix' made the change.*:astropy.wcs.FITSFixedWarning",
    "ignore:'obsfix' made the change.*:astropy.wcs.FITSFixedWarning",
]
markers = [
    "fullstack: CASA/casacore-backed tests for MeasurementSet, imaging, and related workflows",
]

[tool.coverage.report]
exclude_lines = [
    "@njit",
    "pass",
]

[tool.mypy]

[[tool.mypy.overrides]]
module = "pandas.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "astropy.*"
ignore_missing_imports = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
